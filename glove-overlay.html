<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Hand Wireframe Overlay</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1920px;
      max-height: 1080px;
    }

    video { display: none; }

    canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #videoCanvas { z-index: 1; }
    #wireframeCanvas { z-index: 2; pointer-events: none; }

    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px 25px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      line-height: 1.8;
      min-width: 200px;
    }

    #info h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
      font-weight: 800;
    }

    #info p {
      margin: 8px 0;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }

    .value-display {
      color: #0ff;
      font-weight: 700;
    }

    #controls {
      position: absolute;
      right: 20px;
      top: 20px;
      width: 280px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      padding: 25px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .section-header {
      font-size: 10px;
      font-weight: 800;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 20px;
      margin-bottom: 15px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .section-header:first-child { margin-top: 0; }

    .control-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }

    .control-group label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: #888;
      display: flex;
      justify-content: space-between;
    }

    input[type=range] {
      width: 100%;
      cursor: pointer;
      height: 6px;
      border-radius: 3px;
      background: #222;
      appearance: none;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #0ff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,255,255,0.3);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .toggle-text {
      font-size: 12px;
      font-weight: 600;
      color: #ccc;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #666;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #0ff; }
    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #000;
    }

    #status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 12px;
      color: #0ff;
      z-index: 10;
      background: rgba(0,0,0,0.8);
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid rgba(0,255,255,0.2);
    }

    .color-picker-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.active {
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

<div class="container">
  <video id="input_video" playsinline></video>
  <canvas id="videoCanvas"></canvas>
  <canvas id="wireframeCanvas"></canvas>

  <div id="info">
    <h2>3D Hand Wireframe</h2>
    <p>Hands <span id="handCount" class="value-display">0</span></p>
    <p>FPS <span id="fps" class="value-display">0</span></p>
    <p>Vertices <span id="vertexCount" class="value-display">0</span></p>
  </div>

  <div id="controls">
    <div class="section-header">Wireframe Color</div>
    <div class="control-group">
      <div class="color-picker-row">
        <div class="color-swatch active" data-color="0,255,255" style="background: #0ff;"></div>
        <div class="color-swatch" data-color="255,255,255" style="background: #fff;"></div>
        <div class="color-swatch" data-color="0,255,128" style="background: #0f8;"></div>
        <div class="color-swatch" data-color="255,0,128" style="background: #f08;"></div>
        <div class="color-swatch" data-color="128,0,255" style="background: #80f;"></div>
        <div class="color-swatch" data-color="255,200,0" style="background: #fc0;"></div>
        <div class="color-swatch" data-color="255,100,50" style="background: #f64;"></div>
        <div class="color-swatch" data-color="50,200,255" style="background: #3cf;"></div>
      </div>
    </div>

    <div class="section-header">Mesh Density</div>
    <div class="control-group">
      <label>
        <span>Ring Segments</span>
        <span class="value-display" id="ringValue">8</span>
      </label>
      <input type="range" id="ringSegments" min="4" max="16" step="1" value="8">
    </div>

    <div class="control-group">
      <label>
        <span>Length Segments</span>
        <span class="value-display" id="lengthValue">6</span>
      </label>
      <input type="range" id="lengthSegments" min="3" max="12" step="1" value="6">
    </div>

    <div class="section-header">Rendering</div>
    <div class="control-group">
      <label>
        <span>Line Opacity</span>
        <span class="value-display" id="opacityValue">0.8</span>
      </label>
      <input type="range" id="lineOpacity" min="0.2" max="1.0" step="0.1" value="0.8">
    </div>

    <div class="control-group">
      <label>
        <span>Line Width</span>
        <span class="value-display" id="lineWidthValue">1.5</span>
      </label>
      <input type="range" id="lineWidth" min="0.5" max="4.0" step="0.5" value="1.5">
    </div>

    <div class="control-group">
      <label>
        <span>Depth Effect</span>
        <span class="value-display" id="depthValue">0.5</span>
      </label>
      <input type="range" id="depthEffect" min="0" max="1" step="0.1" value="0.5">
    </div>

    <div class="section-header">Display</div>
    <div class="toggle-row">
      <span class="toggle-text">Show Video</span>
      <label class="switch">
        <input type="checkbox" id="showVideo" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-text">Show Rings</span>
      <label class="switch">
        <input type="checkbox" id="showRings" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-text">Show Longitudinal</span>
      <label class="switch">
        <input type="checkbox" id="showLongitudinal" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-text">Show Joints</span>
      <label class="switch">
        <input type="checkbox" id="showJoints" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-text">Glow Effect</span>
      <label class="switch">
        <input type="checkbox" id="glowEffect" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div id="status">Initializing...</div>
</div>

<script>
console.log(">>> 3D Hand Wireframe Overlay");

// DOM Elements
const videoElement = document.getElementById('input_video');
const videoCanvas = document.getElementById('videoCanvas');
const videoCtx = videoCanvas.getContext('2d');
const wireframeCanvas = document.getElementById('wireframeCanvas');
const ctx = wireframeCanvas.getContext('2d');
const statusDiv = document.getElementById('status');
const handCountSpan = document.getElementById('handCount');
const fpsSpan = document.getElementById('fps');
const vertexCountSpan = document.getElementById('vertexCount');

// Create hidden canvas for skin mask processing
const skinCanvas = document.createElement('canvas');
const skinCtx = skinCanvas.getContext('2d', { willReadFrequently: true });
let skinMaskData = null;

// Configuration
let config = {
  wireColor: [0, 255, 255],
  ringSegments: 8,
  lengthSegments: 6,
  lineOpacity: 0.8,
  lineWidth: 1.5,
  depthEffect: 0.5,
  showVideo: true,
  showRings: true,
  showLongitudinal: true,
  showJoints: true,
  glowEffect: true
};

// FPS tracking
let frameCount = 0;
let lastTime = performance.now();

// Particle system
let particles = [];
const PARTICLE_COUNT = 50;
const PARTICLE_LIFETIME = 1000; // ms
let lastTouchTime = 0;
const TOUCH_COOLDOWN = 500; // ms between explosions

// Collision detection state
let touchFrameCount = 0;
const TOUCH_FRAMES_REQUIRED = 3; // Must be touching for 3 frames to trigger
let prevTip1 = null;
let prevTip2 = null;
let lastFingerWidths = null;

// Landmark indices
const WRIST = 0;
const INDEX_TIP = 8;
const FINGERS = [
  { name: 'thumb', indices: [1, 2, 3, 4] },
  { name: 'index', indices: [5, 6, 7, 8] },
  { name: 'middle', indices: [9, 10, 11, 12] },
  { name: 'ring', indices: [13, 14, 15, 16] },
  { name: 'pinky', indices: [17, 18, 19, 20] }
];

// Palm connections
const PALM_CONNECTIONS = [
  [0, 1], [0, 5], [0, 9], [0, 13], [0, 17],
  [1, 5], [5, 9], [9, 13], [13, 17]
];

// UI Event Handlers
document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    config.wireColor = swatch.dataset.color.split(',').map(Number);
  });
});

document.getElementById('ringSegments').oninput = (e) => {
  config.ringSegments = parseInt(e.target.value);
  document.getElementById('ringValue').innerText = config.ringSegments;
};

document.getElementById('lengthSegments').oninput = (e) => {
  config.lengthSegments = parseInt(e.target.value);
  document.getElementById('lengthValue').innerText = config.lengthSegments;
};

document.getElementById('lineOpacity').oninput = (e) => {
  config.lineOpacity = parseFloat(e.target.value);
  document.getElementById('opacityValue').innerText = config.lineOpacity.toFixed(1);
};

document.getElementById('lineWidth').oninput = (e) => {
  config.lineWidth = parseFloat(e.target.value);
  document.getElementById('lineWidthValue').innerText = config.lineWidth.toFixed(1);
};

document.getElementById('depthEffect').oninput = (e) => {
  config.depthEffect = parseFloat(e.target.value);
  document.getElementById('depthValue').innerText = config.depthEffect.toFixed(1);
};

document.getElementById('showVideo').onchange = (e) => {
  config.showVideo = e.target.checked;
  videoCanvas.style.opacity = config.showVideo ? 1 : 0;
};

document.getElementById('showRings').onchange = (e) => config.showRings = e.target.checked;
document.getElementById('showLongitudinal').onchange = (e) => config.showLongitudinal = e.target.checked;
document.getElementById('showJoints').onchange = (e) => config.showJoints = e.target.checked;
document.getElementById('glowEffect').onchange = (e) => config.glowEffect = e.target.checked;

// Convert landmark to screen coordinates
function landmarkToScreen(lm, w, h) {
  return {
    x: (1 - lm.x) * w,
    y: lm.y * h,
    z: lm.z
  };
}

// Interpolate between two points
function lerp(a, b, t) {
  return {
    x: a.x + (b.x - a.x) * t,
    y: a.y + (b.y - a.y) * t,
    z: a.z + (b.z - a.z) * t
  };
}

// Get perpendicular vectors for creating tube geometry
function getPerpendicularBasis(p1, p2) {
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;

  // Perpendicular in 2D
  return {
    px: -dy / len,
    py: dx / len
  };
}

// Calculate depth-based opacity and width
function getDepthModifiers(z, minZ, maxZ) {
  const range = maxZ - minZ || 0.1;
  const normalized = (z - minZ) / range;

  // Closer = brighter and thicker
  const opacity = 0.5 + (1 - normalized) * 0.5;
  const width = 0.7 + (1 - normalized) * 0.6;

  return { opacity, width };
}

// Generate finger tube mesh with edge-detected radius
function generateFingerMesh(landmarks, fingerIndices, baseWidth, w, h, minZ, maxZ) {
  const points = fingerIndices.map(i => landmarkToScreen(landmarks[i], w, h));
  const mesh = { rings: [], longitudinals: [] };

  // Generate ring segments along the finger
  const numRings = config.lengthSegments;
  const numPoints = config.ringSegments;

  // Max radius for ray casting (based on estimated finger width)
  const maxSearchRadius = baseWidth * 3;

  for (let r = 0; r <= numRings; r++) {
    const t = r / numRings;
    const segmentIndex = Math.min(Math.floor(t * (points.length - 1)), points.length - 2);
    const localT = (t * (points.length - 1)) - segmentIndex;

    const p1 = points[segmentIndex];
    const p2 = points[segmentIndex + 1];
    const center = lerp(p1, p2, localT);

    // Get perpendicular direction for edge detection
    const { px, py } = getPerpendicularBasis(p1, p2);

    // MEASURE ACTUAL RADIUS using skin edge detection
    const measuredRadius = measureFingerRadius(center.x, center.y, px, py, maxSearchRadius);

    // Use measured radius (with small padding for visual coverage)
    const radius = measuredRadius * 1.1;

    // Generate ring points
    const ring = [];
    for (let i = 0; i < numPoints; i++) {
      const angle = (i / numPoints) * Math.PI * 2;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);

      // Elliptical cross-section (slightly flatter)
      const rx = radius * 1.0;
      const ry = radius * 0.8;

      ring.push({
        x: center.x + px * cos * rx + py * sin * ry * 0.3,
        y: center.y + py * cos * rx + px * sin * ry * 0.3,
        z: center.z + sin * 0.01
      });
    }

    mesh.rings.push(ring);
  }

  // Generate longitudinal lines
  for (let i = 0; i < numPoints; i++) {
    const line = [];
    for (let r = 0; r <= numRings; r++) {
      line.push(mesh.rings[r][i]);
    }
    mesh.longitudinals.push(line);
  }

  return mesh;
}

// Generate palm mesh
function generatePalmMesh(landmarks, w, h) {
  const palmIndices = [0, 1, 5, 9, 13, 17];
  const points = palmIndices.map(i => landmarkToScreen(landmarks[i], w, h));

  // Create grid on palm
  const mesh = { lines: [] };

  // Radial lines from wrist
  const wrist = points[0];
  for (let i = 1; i < points.length; i++) {
    mesh.lines.push([wrist, points[i]]);
  }

  // Cross lines between finger bases
  for (let i = 1; i < points.length - 1; i++) {
    mesh.lines.push([points[i], points[i + 1]]);
  }

  // Additional palm grid
  const center = {
    x: points.reduce((s, p) => s + p.x, 0) / points.length,
    y: points.reduce((s, p) => s + p.y, 0) / points.length,
    z: points.reduce((s, p) => s + p.z, 0) / points.length
  };

  for (let i = 1; i < points.length; i++) {
    mesh.lines.push([center, lerp(points[i], points[(i % (points.length - 1)) + 1], 0.5)]);
  }

  return mesh;
}

// Draw a line with depth-based styling
function drawLine(p1, p2, minZ, maxZ) {
  const avgZ = (p1.z + p2.z) / 2;
  const { opacity, width } = getDepthModifiers(avgZ, minZ, maxZ);

  const finalOpacity = config.lineOpacity * (config.depthEffect > 0 ?
    (1 - config.depthEffect) + config.depthEffect * opacity : 1);
  const finalWidth = config.lineWidth * (config.depthEffect > 0 ?
    (1 - config.depthEffect) + config.depthEffect * width : 1);

  const [r, g, b] = config.wireColor;

  // Glow effect
  if (config.glowEffect) {
    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${finalOpacity * 0.3})`;
    ctx.lineWidth = finalWidth * 3;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }

  // Main line
  ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${finalOpacity})`;
  ctx.lineWidth = finalWidth;
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
}

// Draw joint marker
function drawJoint(point, minZ, maxZ) {
  const { opacity, width } = getDepthModifiers(point.z, minZ, maxZ);
  const [r, g, b] = config.wireColor;
  const size = 4 * width;

  // Glow
  if (config.glowEffect) {
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity * 0.3})`;
    ctx.beginPath();
    ctx.arc(point.x, point.y, size * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Joint dot
  ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity * config.lineOpacity})`;
  ctx.beginPath();
  ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
  ctx.fill();

  // Inner highlight
  ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.5})`;
  ctx.beginPath();
  ctx.arc(point.x - size * 0.2, point.y - size * 0.2, size * 0.4, 0, Math.PI * 2);
  ctx.fill();
}

// Calculate distance between two screen points
function distance(p1, p2) {
  return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
}

// ============ SKIN SEGMENTATION & EDGE DETECTION ============

// Generate skin mask from video frame
function generateSkinMask(w, h) {
  if (skinCanvas.width !== w || skinCanvas.height !== h) {
    skinCanvas.width = w;
    skinCanvas.height = h;
  }

  // Draw mirrored video to skin canvas
  skinCtx.save();
  skinCtx.translate(w, 0);
  skinCtx.scale(-1, 1);
  skinCtx.drawImage(videoElement, 0, 0, w, h);
  skinCtx.restore();

  // Get image data
  const imageData = skinCtx.getImageData(0, 0, w, h);
  const data = imageData.data;

  // Create binary skin mask
  const mask = new Uint8Array(w * h);

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    // Convert RGB to YCrCb
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
    const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;

    // Skin detection using YCrCb thresholds
    const isSkin = (
      cr >= 133 && cr <= 173 &&
      cb >= 77 && cb <= 127 &&
      y > 80
    );

    mask[i / 4] = isSkin ? 255 : 0;
  }

  // Simple morphological operations (dilate then erode for noise reduction)
  const dilated = dilate(mask, w, h, 2);
  const cleaned = erode(dilated, w, h, 1);

  skinMaskData = { mask: cleaned, width: w, height: h };
  return skinMaskData;
}

// Dilate the mask
function dilate(mask, w, h, radius) {
  const result = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let found = false;
      for (let dy = -radius; dy <= radius && !found; dy++) {
        for (let dx = -radius; dx <= radius && !found; dx++) {
          const nx = x + dx;
          const ny = y + dy;
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            if (mask[ny * w + nx] > 0) found = true;
          }
        }
      }
      result[y * w + x] = found ? 255 : 0;
    }
  }
  return result;
}

// Erode the mask
function erode(mask, w, h, radius) {
  const result = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let allSkin = true;
      for (let dy = -radius; dy <= radius && allSkin; dy++) {
        for (let dx = -radius; dx <= radius && allSkin; dx++) {
          const nx = x + dx;
          const ny = y + dy;
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            if (mask[ny * w + nx] === 0) allSkin = false;
          } else {
            allSkin = false;
          }
        }
      }
      result[y * w + x] = allSkin ? 255 : 0;
    }
  }
  return result;
}

// Check if a point is skin
function isSkinAt(x, y) {
  if (!skinMaskData) return false;
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  if (ix < 0 || ix >= skinMaskData.width || iy < 0 || iy >= skinMaskData.height) return false;
  return skinMaskData.mask[iy * skinMaskData.width + ix] > 0;
}

// Measure finger radius at a point by casting rays outward from center
function measureFingerRadius(centerX, centerY, perpX, perpY, maxRadius) {
  if (!skinMaskData) return maxRadius * 0.5;

  // Cast rays in both perpendicular directions to find edges
  let radius1 = 0;
  let radius2 = 0;

  // Ray in positive perpendicular direction
  for (let r = 1; r <= maxRadius; r++) {
    const x = centerX + perpX * r;
    const y = centerY + perpY * r;
    if (!isSkinAt(x, y)) {
      radius1 = r - 1;
      break;
    }
    radius1 = r;
  }

  // Ray in negative perpendicular direction
  for (let r = 1; r <= maxRadius; r++) {
    const x = centerX - perpX * r;
    const y = centerY - perpY * r;
    if (!isSkinAt(x, y)) {
      radius2 = r - 1;
      break;
    }
    radius2 = r;
  }

  // Use the average of both directions, with minimum threshold
  const measuredRadius = (radius1 + radius2) / 2;
  return Math.max(measuredRadius, 3); // Minimum 3 pixels
}

// ============ END SKIN SEGMENTATION ============

// Particle class
class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.birthTime = performance.now();

    // Random velocity in all directions
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;

    // Random size and color variation
    this.size = 2 + Math.random() * 4;
    this.hue = Math.random() * 60 - 30; // Variation around base color
    this.brightness = 0.8 + Math.random() * 0.2;

    // Gravity and friction
    this.gravity = 0.1;
    this.friction = 0.98;
  }

  update() {
    this.vy += this.gravity;
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.x += this.vx;
    this.y += this.vy;
  }

  getAge() {
    return performance.now() - this.birthTime;
  }

  isAlive() {
    return this.getAge() < PARTICLE_LIFETIME;
  }

  draw(ctx) {
    const age = this.getAge();
    const lifeRatio = 1 - (age / PARTICLE_LIFETIME);
    const [r, g, b] = config.wireColor;

    // Fade out over lifetime
    const alpha = lifeRatio * this.brightness;

    // Size shrinks over time
    const currentSize = this.size * lifeRatio;

    // Outer glow
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, currentSize * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Inner bright core
    ctx.fillStyle = `rgba(${Math.min(255, r + 50)}, ${Math.min(255, g + 50)}, ${Math.min(255, b + 50)}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, currentSize, 0, Math.PI * 2);
    ctx.fill();

    // White hot center
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, currentSize * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Create particle explosion at point
function createExplosion(x, y) {
  const now = performance.now();
  if (now - lastTouchTime < TOUCH_COOLDOWN) return;
  lastTouchTime = now;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle(x, y));
  }
}

// Update and draw all particles
function updateAndDrawParticles() {
  // Update particles
  particles = particles.filter(p => p.isAlive());

  for (const particle of particles) {
    particle.update();
    particle.draw(ctx);
  }
}

// Calculate 3D distance between two points (includes Z depth)
function distance3D(p1, p2, w, h) {
  // Z is normalized roughly -0.1 to 0.1, scale it to be comparable to screen coords
  const zScale = Math.min(w, h) * 0.5;
  const dz = (p2.z - p1.z) * zScale;
  return Math.sqrt(
    Math.pow(p2.x - p1.x, 2) +
    Math.pow(p2.y - p1.y, 2) +
    Math.pow(dz, 2)
  );
}

// Calculate fingertip radius from finger width
function getFingertipRadius(hands, w, h) {
  // Calculate finger widths for both hands and average
  const widths1 = calculateFingerWidths(hands[0], w, h);
  const widths2 = calculateFingerWidths(hands[1], w, h);

  // Index fingertip radius is roughly the finger width
  const avgIndexWidth = (widths1.index + widths2.index) / 2;

  // Store for use in collision
  lastFingerWidths = { w1: widths1, w2: widths2 };

  return avgIndexWidth;
}

// Check if fingertips are moving toward each other (velocity-based)
function areFingertipsApproaching(tip1, tip2) {
  if (!prevTip1 || !prevTip2) return true; // Can't determine, assume yes

  const prevDist = distance(prevTip1, prevTip2);
  const currDist = distance(tip1, tip2);

  // They're approaching if current distance is less than previous
  return currDist <= prevDist;
}

// Sphere collision detection with actual fingertip sizes
function checkFingerTouch(hands, w, h) {
  if (hands.length < 2) {
    touchFrameCount = 0;
    prevTip1 = null;
    prevTip2 = null;
    return null;
  }

  // Get index fingertip positions for both hands (with Z)
  const tip1 = landmarkToScreen(hands[0][INDEX_TIP], w, h);
  const tip2 = landmarkToScreen(hands[1][INDEX_TIP], w, h);

  // Calculate actual fingertip radius from hand landmarks
  const fingertipRadius = getFingertipRadius(hands, w, h);

  // Sphere collision: touching when distance < sum of radii
  // Use slightly smaller collision radius for accuracy (80% of visual radius)
  const collisionRadius = fingertipRadius * 0.8;
  const touchThreshold = collisionRadius * 2; // Sum of both fingertip radii

  // Calculate 3D distance (includes depth)
  const dist3D = distance3D(tip1, tip2, w, h);

  // Also check 2D distance as sanity check
  const dist2D = distance(tip1, tip2);

  // Check if fingers are close enough AND approaching each other
  const isTouching = dist3D < touchThreshold && dist2D < touchThreshold;
  const isApproaching = areFingertipsApproaching(tip1, tip2);

  // Update previous positions for velocity tracking
  prevTip1 = { ...tip1 };
  prevTip2 = { ...tip2 };

  if (isTouching) {
    touchFrameCount++;

    // Only trigger after sustained contact for required frames
    if (touchFrameCount >= TOUCH_FRAMES_REQUIRED) {
      // Return midpoint between the two fingertips
      return {
        x: (tip1.x + tip2.x) / 2,
        y: (tip1.y + tip2.y) / 2
      };
    }
  } else {
    // Reset counter if not touching
    touchFrameCount = Math.max(0, touchFrameCount - 1); // Gradual decay
  }

  return null;
}

// Calculate actual finger widths from landmark positions
function calculateFingerWidths(landmarks, w, h) {
  // Get screen positions of finger bases and tips
  const fingerBases = [5, 9, 13, 17].map(i => landmarkToScreen(landmarks[i], w, h));
  const thumbBase = landmarkToScreen(landmarks[2], w, h);
  const thumbTip = landmarkToScreen(landmarks[4], w, h);

  // Calculate width from spacing between adjacent finger bases
  // Average distance between adjacent finger bases gives us finger width
  let totalSpacing = 0;
  for (let i = 0; i < fingerBases.length - 1; i++) {
    totalSpacing += distance(fingerBases[i], fingerBases[i + 1]);
  }
  const avgFingerSpacing = totalSpacing / (fingerBases.length - 1);

  // Finger width is roughly 20% of the spacing between finger bases
  const baseFingerWidth = avgFingerSpacing * 0.20;

  // Calculate thumb width separately (wider)
  const thumbWidth = baseFingerWidth * 1.3;

  return {
    thumb: thumbWidth,
    index: baseFingerWidth * 0.95,
    middle: baseFingerWidth * 1.0,
    ring: baseFingerWidth * 0.9,
    pinky: baseFingerWidth * 0.7
  };
}

// Draw complete hand wireframe
function drawHandWireframe(landmarks, w, h) {
  // Calculate depth range
  const zValues = landmarks.map(l => l.z);
  const minZ = Math.min(...zValues);
  const maxZ = Math.max(...zValues);

  // Calculate actual finger widths from video
  const fingerWidths = calculateFingerWidths(landmarks, w, h);

  // For palm connections, use average width
  const wrist = landmarkToScreen(landmarks[0], w, h);
  const baseWidth = fingerWidths.index;

  let totalVertices = 0;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Draw palm mesh
  const palmMesh = generatePalmMesh(landmarks, w, h);
  for (const line of palmMesh.lines) {
    drawLine(line[0], line[1], minZ, maxZ);
    totalVertices += 2;
  }

  // Draw each finger with auto-calculated width
  for (const finger of FINGERS) {
    const autoWidth = fingerWidths[finger.name] || baseWidth;
    const mesh = generateFingerMesh(
      landmarks,
      finger.indices,
      autoWidth,
      w, h, minZ, maxZ
    );

    // Draw ring segments
    if (config.showRings) {
      for (const ring of mesh.rings) {
        for (let i = 0; i < ring.length; i++) {
          const next = (i + 1) % ring.length;
          drawLine(ring[i], ring[next], minZ, maxZ);
          totalVertices++;
        }
      }
    }

    // Draw longitudinal lines
    if (config.showLongitudinal) {
      for (const line of mesh.longitudinals) {
        for (let i = 0; i < line.length - 1; i++) {
          drawLine(line[i], line[i + 1], minZ, maxZ);
          totalVertices++;
        }
      }
    }
  }

  // Draw joints
  if (config.showJoints) {
    for (let i = 0; i < landmarks.length; i++) {
      const point = landmarkToScreen(landmarks[i], w, h);
      drawJoint(point, minZ, maxZ);
      totalVertices++;
    }
  }

  // Draw connections between fingers and palm
  const fingerBases = [1, 5, 9, 13, 17];
  for (const baseIdx of fingerBases) {
    const base = landmarkToScreen(landmarks[baseIdx], w, h);
    drawLine(wrist, base, minZ, maxZ);
    totalVertices += 2;
  }

  vertexCountSpan.innerText = totalVertices;
}

// Prepare video canvas
function prepareVideoCanvas() {
  const vw = videoElement.videoWidth;
  const vh = videoElement.videoHeight;

  if (videoCanvas.width !== vw || videoCanvas.height !== vh) {
    videoCanvas.width = vw;
    videoCanvas.height = vh;
    wireframeCanvas.width = vw;
    wireframeCanvas.height = vh;
  }

  videoCtx.save();
  videoCtx.translate(videoCanvas.width, 0);
  videoCtx.scale(-1, 1);
  videoCtx.drawImage(videoElement, 0, 0, videoCanvas.width, videoCanvas.height);
  videoCtx.restore();
}

// Handle hand tracking results
function onHandResults(results) {
  prepareVideoCanvas();

  // Clear wireframe canvas
  ctx.clearRect(0, 0, wireframeCanvas.width, wireframeCanvas.height);

  const numHands = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
  handCountSpan.innerText = numHands;

  if (numHands > 0) {
    // Generate skin mask for edge detection (used by finger mesh)
    generateSkinMask(wireframeCanvas.width, wireframeCanvas.height);

    // Draw wireframes for all hands
    for (const landmarks of results.multiHandLandmarks) {
      drawHandWireframe(landmarks, wireframeCanvas.width, wireframeCanvas.height);
    }

    // Check for index fingertip touch between two hands
    if (numHands >= 2) {
      const touchPoint = checkFingerTouch(
        results.multiHandLandmarks,
        wireframeCanvas.width,
        wireframeCanvas.height
      );

      if (touchPoint) {
        createExplosion(touchPoint.x, touchPoint.y);
      }
    }
  } else {
    vertexCountSpan.innerText = '0';
  }

  // Update and draw particles (always, even if no hands)
  updateAndDrawParticles();

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fpsSpan.innerText = frameCount;
    frameCount = 0;
    lastTime = now;
  }
}

// Initialize
async function initApp() {
  try {
    statusDiv.innerText = "Requesting camera...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }
    });

    videoElement.srcObject = stream;
    await videoElement.play();

    statusDiv.innerText = "Loading hand tracking...";

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onHandResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 1280,
      height: 720
    });

    await camera.start();
    statusDiv.innerText = "3D Wireframe Active";

  } catch (error) {
    console.error("Init error:", error);
    statusDiv.innerText = "Error: " + error.message;
    alert("Failed to start: " + error.message);
  }
}

window.onload = initApp;
</script>
